name: Deploy to GitHub Pages

permissions:
  contents: write # 确保工作流程有写入权限
  pages: write

on:
  push:
    branches: [main] # 只在 main 分支推送时触发

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出 main 分支代码
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # 获取完整历史记录

      # 2. 设置 Node.js 环境
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3. 安装依赖并构建（示例使用 pnpm）
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Build project
        run: pnpm run build

      # 4. 创建 gh-pages 分支并部署 dist 内容
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # 指定要部署的目录为 dist
          publish_dir: ./dist
          # 目标分支设为 gh-pages
          publish_branch: gh-pages
          # 创建孤儿分支，只包含最新内容
          force_orphan: true
          # 保留 .nojekyll 文件（如果存在）
          keep_files: false
          # 允许空提交
          allow_empty_commit: true
          # 自定义提交信息
          commit_message: "Deploy dist from main branch"
